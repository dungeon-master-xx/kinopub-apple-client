name: CI

# Compile-checks pushes to the main branches and PRs, so "merge to main" is always green.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'AppIcon Exports/**'
      - '.github/release.yml'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'AppIcon Exports/**'
      - 'LICENSE'

permissions:
  contents: read

# Newer pushes/merges on the same ref cancel still-running builds, so rapid merges don't pile up
# (and don't burn extra runner minutes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Fork PRs are gated by GitHub's own "fork pull request workflows" approval setting, not by a
    # job-level `if`. That distinction matters: an unapproved run sits *pending*, which correctly
    # holds the required `build` check, whereas a skipped job is reported as passing — so the old
    # guard let a fork PR merge into protected `main` with no CI at all. Minutes are free on public
    # repos, so there was nothing to save either.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$XC" ] && sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Build (iOS, unsigned)
        run: |
          xcodebuild \
            -project KinoPubAppleClient.xcodeproj \
            -scheme KinoPubAppleClient \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build
